<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LDCT 判讀資料解析工具</title>
<style>
:root{--bg:#f5f7fa;--sur:#fff;--sur2:#f0f2f5;--bd:#d0d7de;--acc:#0969da;--text:#1f2328;--t2:#57606a;--t3:#8c959f;--ok:#1a7f37;--warn:#9a6700;--err:#cf222e;--mono:'IBM Plex Mono',monospace;--sans:'Noto Sans TC',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column}
header{background:var(--sur);border-bottom:2px solid var(--bd);padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.logo{width:32px;height:32px;background:var(--acc);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px}
header h1{font-size:14px;font-weight:700}
.tag{font-family:var(--mono);font-size:10px;color:var(--t3);background:var(--sur2);border:1px solid var(--bd);padding:2px 7px;border-radius:4px}
.hright{margin-left:auto}
.badge{font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--bd);color:var(--t2);background:var(--sur2)}
main{display:grid;grid-template-columns:1fr 1fr;flex:1;height:calc(100vh - 61px)}
.panel{display:flex;flex-direction:column;border-right:1px solid var(--bd);overflow:hidden;background:var(--sur)}
.panel:last-child{border-right:none;background:var(--bg)}
.ph{background:var(--sur2);border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.pt{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.06em}
.ps{font-size:11px;color:var(--t3);margin-left:auto}
.qbar{background:var(--sur2);border-bottom:1px solid var(--bd);padding:6px 16px;display:flex;gap:6px;align-items:center;flex-shrink:0;overflow-x:auto;min-height:36px}
.qlabel{font-family:var(--mono);font-size:10px;color:var(--t3);white-space:nowrap;text-transform:uppercase}
.qi{font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:12px;border:1px solid var(--bd);cursor:pointer;white-space:nowrap;color:var(--t2);background:var(--sur);transition:all .1s}
.qi.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.qi.done{border-color:var(--ok);color:var(--ok)}
.qi.warn{border-color:var(--warn);color:var(--warn)}
.ia{flex:1;overflow:hidden;display:flex;flex-direction:column}
textarea{flex:1;background:var(--sur);border:none;color:var(--text);font-family:var(--mono);font-size:12px;line-height:1.75;padding:16px;resize:none;outline:none}
textarea::placeholder{color:var(--t3)}
.mbar{background:var(--sur2);border-top:1px solid var(--bd);padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}
.mf{display:flex;flex-direction:column;gap:3px}
.ml{font-family:var(--mono);font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.05em}
.mi{background:var(--sur);border:1px solid var(--bd);border-radius:5px;color:var(--text);font-family:var(--mono);font-size:12px;padding:4px 7px;width:110px;outline:none;transition:border-color .15s}
.mi:focus{border-color:var(--acc)}
.mi.wide{width:145px}
.abar{background:var(--sur);border-top:1px solid var(--bd);padding:9px 16px;display:flex;gap:7px;align-items:center;flex-shrink:0}
.btn{font-family:var(--mono);font-size:12px;font-weight:700;padding:6px 14px;border-radius:6px;border:1px solid transparent;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:5px}
.bp{background:var(--acc);color:#fff;border-color:var(--acc)}.bp:hover{background:#0550ae}
.bs{background:var(--sur);color:var(--t2);border-color:var(--bd)}.bs:hover{border-color:var(--t2);color:var(--text)}
.be{background:#1a7f37;color:#fff;margin-left:auto}.be:hover{background:#146f2f}.be:disabled{opacity:.4;cursor:not-allowed}
.ra{flex:1;overflow-y:auto;padding:12px 16px}
.fg{margin-bottom:12px}
.gt{font-family:var(--mono);font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid var(--bd)}
.fr{display:flex;align-items:flex-start;gap:6px;padding:3px 0;border-bottom:1px solid rgba(208,215,222,.4)}
.fr:last-child{border-bottom:none}
.fn{font-family:var(--mono);font-size:10px;color:var(--t3);min-width:24px;padding-top:2px}
.fname{font-size:11px;color:var(--t2);flex:1;min-width:0}
.fv{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:4px;min-width:44px;text-align:right;max-width:180px;word-break:break-all}
.fv.e{color:var(--t3)}
.fv.f{background:#ddf4ff;color:#0550ae;border:1px solid #b6e3ff}
.alert{margin-bottom:8px;padding:8px 12px;border-radius:6px;font-size:12px}
.aw{background:#fff8c5;border:1px solid #f7d87c;color:var(--warn)}
.ae{background:#ffebe9;border:1px solid #ffcecb;color:var(--err)}
.ao{background:#dafbe1;border:1px solid #aceebb;color:var(--ok)}
.es{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--t3)}
.ei{font-size:36px;opacity:.4}
.sb{background:var(--sur2);border-top:1px solid var(--bd);padding:6px 16px;display:flex;gap:12px;align-items:center;flex-shrink:0}
.si{font-family:var(--mono);font-size:11px;display:flex;align-items:center;gap:4px}
.dot{width:6px;height:6px;border-radius:50%}
.dok{background:var(--ok)}.dwn{background:var(--warn)}.der{background:var(--err)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
</style>

<script>
// ═══════════════════════════════════════

var HSHORT = ["姓名","出生日期","身分證字號","攝影醫院代碼","攝影日期","判讀日期","判讀醫師","LDCT Quality","CTDIvol","Total DLP","In comparison with prior CT","Prior CT Date","No lung nodule","Nodule with benign features","<6mm 勾選","<6mm SE","<6mm IM","Juxtapleural nodule","≧6mm 勾選","Total number","N1 大小(mm)","N1 Density","N1 Solid part(mm)","N1 Lobe SE","N1 Lobe IM","N1 Lobe","N1 Nodule is","N2 大小(mm)","N2 Density","N2 Solid part(mm)","N2 Lobe SE","N2 Lobe IM","N2 Lobe","N2 Nodule is","N3 大小(mm)","N3 Density","N3 Solid part(mm)","N3 Lobe SE","N3 Lobe IM","N3 Lobe","N3 Nodule is","Nodules else 勾選","Nodules else SE","Nodules else IM","Nodules else RUL","Nodules else RML","Nodules else RLL","Nodules else LUL","Nodules else LLL","Airway nodule","Airway-Subsegmental Cat2","Airway-Segmental proximal","Segmental-Favors secretions","Segmental-At baseline 4A","Segmental-Stable/growing 4B","Atypical cyst","Cyst Cat3","Cyst Cat3 SE","Cyst Cat3 IM","Cyst Cat3 位置","Cyst Cat4A","Cyst Cat4A SE","Cyst Cat4A IM","Cyst Cat4A 位置","Cyst Cat4B","Cyst Cat4B SE","Cyst Cat4B IM","Cyst Cat4B 位置","Metastases pattern","Emphysema","Bronchiectasis","Bronchitis/bronchiolitis","Tree-in-bud","Centrilobular nodules","Old pulmonary TB","ILD","Other Lung 勾選","Other Lung 描述","Enlarged LN 勾選","Enlarged LN 描述","CAC 勾選","CAC 描述","Abnormal chest 勾選","Abnormal chest 描述","Abdominal/neck 勾選","Abdominal/neck 描述","Overall Category","Category0 subtype","Modifier S","請至門診就診"];

var HFULL = ["姓名","出生日期","身分證字號/居留證號","攝影醫院代碼","攝影日期","判讀日期","判讀醫師","LDCT Quality","CTDIvol:___mGy","Total DLP:___mGy*cm","In comparison with the prior CT","In comparison with the prior CT, Date ___(Y)/___(M)/___(D)","No lung nodule","Nodule with benign features","Lung nodule(s) (<6 mm)(For example,SE:___,IM:___)","Lung nodule(s) (<6 mm) (For example, SE:___)","Lung nodule(s) (<6 mm) (For example, IM:___)","Juxtapleural nodule.","Lung nodule(s) (≧6 mm or enlargeing>1.5mm or new≧4mm)","total number □1 □2 □3 □≧4, and described as followings請依序描述最懷疑之肺結節(Describe the most worrisome nodule in order)","Lung nodule 1 (size, character and location)-Entire Nodule: ___mm","Lung nodule 1 (size, character and location)-Density","Lung nodule 1 (size, character and location)-Density_part-solid (solid part: ___ mm)","Lung nodule 1 (size, character and location)-Lobe: SE:___, ","Lung nodule 1 (size, character and location)-Lobe: IM:___","Lung nodule 1 (size, character and location)- Lobe: (SE:___, IM:___)","Lung nodule 1 (size, character and location)-The nodule is","Lung nodule 2 (size, character and location)-Entire Nodule: ___mm","Lung nodule 2 (size, character and location)-Density","Lung nodule 2 (size, character and location)-Density_part-solid (solid part: ___ mm)","Lung nodule 2 (size, character and location)-Lobe: SE:___, ","Lung nodule 2 (size, character and location)-Lobe: IM:___","Lung nodule 2 (size, character and location)-Lobe: (SE:___, IM:___)","Lung nodule 2 (size, character and location)-The nodule is","Lung nodule 3 (size, character and location)-Entire Nodule: ___mm","Lung nodule 3 (size, character and location)-Density","Lung nodule 3 (size, character and location)-Density_part-solid (solid part: ___ mm)","Lung nodule 3 (size, character and location)-Lobe: SE:___, ","Lung nodule 3 (size, character and location)-Lobe: IM:___","Lung nodule 3 (size, character and location)- Lobe: (SE:___, IM:___)","Lung nodule 3 (size, character and location)-The nodule is","Lung nodules else","Lung nodules else-(SE:___)","Lung nodules else-(IM:___)","Lung nodules else-RUL","Lung nodules else-RML","Lung nodules else-RLL","Lung nodules else-LUL","Lung nodules else-LLL","Airway nodule","Airway nodule-Subsegmental (Category 2)","Airway nodule-Segmental or more proximal","Segmental or more proximal - Favors secretions (Category 2)","Segmental or more proximal - At baseline (Category 4A)","Segmental or more proximal - Stable or growing (Category 4B)","Atypical pulmonary cyst","Atypical pulmonary cyst-Category 3","Atypical pulmonary cyst-Category 3-Lobe: SE:___, ","Atypical pulmonary cyst-Category 3-Lobe: IM:___","Atypical pulmonary cyst-Category 3-位置","Atypical pulmonary cyst-Category 4A","Atypical pulmonary cyst-Category 4A-Lobe: SE:___, ","Atypical pulmonary cyst-Category 4A-Lobe: IM:___","Atypical pulmonary cyst-Category 4A-位置","Atypical pulmonary cyst-Category 4B","Atypical pulmonary cyst-Category 4B-Lobe: SE:___, ","Atypical pulmonary cyst-Category 4B-Lobe: IM:___","Atypical pulmonary cyst-Category 4B-位置","The pattern of lung nodules has the higher probability of metastases","Other Lung Findings-Emphysema","Other Lung Findings-Bronchiectasis","Other Lung Findings-Bronchitis/bronchiolitis","Other Lung Findings-Tree-in-bud pattern","Other Lung Findings-Centrilobular nodules","Other Lung Findings-Old pulmonary TB","Interstitial lung disease (ILD)","Other Lung Findings-非上述之Other Lung Findings(勾選)","Other Lung Findings-非上述之Other Lung Findings(敘述)","Other Findings-Enlarged lymph nodes,location___(勾選)","Other Findings-Enlarged lymph nodes,location___(敘述)","Other Findings-Coronary artery calcification(勾選)","Other Findings-Coronary artery calcification___(敘述)","Other Findings-Other significant abnormal chest findings___(勾選)","Other Findings-Other significant abnormal chest findings___(敘述)","Other Findings-Other significant abnormal abdominal or neck findings in this chest CT scan___(勾選)","Other Findings-Other significant abnormal abdominal or neck findings in this chest CT scan___(敘述)","Overall recommendation-判讀結果","Overall recommendation-判讀結果-Category0","Overall recommendation-Category S: Other. Clinically significant or potentially clinically significant findings (non lung cancer).","Overall recommendation-請至門診就診"];

var GROUPS = [
  {t:'基本資料',c:[0,1,2,3,4,5,6]},
  {t:'CT 技術參數',c:[7,8,9,10,11]},
  {t:'結節發現 - 基本',c:[12,13,14,15,16,17,18,19]},
  {t:'結節 1',c:[20,21,22,23,24,25,26]},
  {t:'結節 2',c:[27,28,29,30,31,32,33]},
  {t:'結節 3',c:[34,35,36,37,38,39,40]},
  {t:'其餘結節',c:[41,42,43,44,45,46,47,48]},
  {t:'Airway nodule',c:[49,50,51,52,53,54]},
  {t:'Atypical pulmonary cyst',c:[55,56,57,58,59,60,61,62,63,64,65,66,67,68]},
  {t:'Other Lung Findings',c:[69,70,71,72,73,74,75,76,77]},
  {t:'Other Findings',c:[78,79,80,81,82,83,84,85]},
  {t:'Overall Recommendation',c:[86,87,88,89]}
];

// ═══════════════════════════════════════
// CORE HELPERS
// ═══════════════════════════════════════

// 統一勾選符號 pattern — [v] 或 ■ 或「行首/空白後的 v 加空白」
var CHK = '(?:\\[v\\]|■|(?:(?:^|(?<=[\\s]))v(?=[\\s])))';

function isChk(text) {
  return /\[v\]|■|(?:(?:^|(?<=[ \t]))v(?=[ \t\n]))/m.test(text);
}

// 檢查某行/文字中 特定 pattern 前面有無勾選符號
function chkLine(line) {
  return /\[v\]|■|(?:(?:^|[ \t])v[ \t])/.test(line);
}

function getSE(s) {
  var m = s.match(/SE:\s*_*(\d+)/i);
  return m ? m[1] : '';
}

function getIM(s) {
  // 抓 IM: 後的數字序列，支援逗號/分號/空格/底線混用
  var m = s.match(/IM:\s*_*([\d][\d,;\s._]*)/i);
  if (!m) return '';
  var raw = m[1].replace(/_/g,' ').trim();
  // 移除尾端非數字
  raw = raw.replace(/[^\d;,\s]+$/,'').trim();
  // 統一為分號分隔，無空格
  return raw.replace(/[,;]+\s*/g,';').replace(/\s+/g,';').replace(/;+/g,';').replace(/;$/,'');
}

function getMGy(text, label) {
  // 支援 CTDIvol: 1.9 / CTDIvol:_1.0_ / CTDIvol:__1__ / CTDIvol:\t1.9
  var re = new RegExp(label + '[:\\s_]*_*([\\.\\d]+)', 'i');
  var m = text.match(re);
  return m ? m[1] : '';
}

function getRocDate(text) {
  var m = null;
  // 1. 民國 107 (Y)/11 (M)/20 (D) 或 114(Y)/6(M)/10(D)
  m = text.match(/民國\s*(\d{2,3})\s*\(?Y\)?\s*[\/\-]?\s*(\d{1,2})\s*\(?M\)?\s*[\/\-]?\s*(\d{1,2})/i);
  if (!m) m = text.match(/民國\D*(\d{2,3})\D+(\d{1,2})\D+(\d{1,2})/);
  // 2. 純數字格式 113(Y)/2(M)/7(D)（在 comparison 行，無「民國」）
  if (!m) {
    var cl = text.match(/comparison[^\n]*/i);
    if (cl) m = cl[0].match(/(\d{2,3})\s*\(?Y\)?\s*\/\s*(\d{1,2})\s*\(?M\)?\s*\/\s*(\d{1,2})/i);
  }
  if (!m) return '';
  var yr=parseInt(m[1]), mo=parseInt(m[2]), dy=parseInt(m[3]);
  // 合理性檢查
  if (yr<80||mo<1||mo>12||dy<1||dy>31) return '';
  // 民國年後緊跟空白+Y 表示未填（如 民國    (Y)）
  var rocLine = text.match(/民國[^\n]*/);
  if (rocLine && /民國[\s\t_]*\(?Y\)?/.test(rocLine[0].slice(0,12))) return '';
  return '' + (yr+1911) + ('0'+mo).slice(-2) + ('0'+dy).slice(-2);
}

function getDensity(s) {
  // 找有勾的 density
  if (/\[v\]\s*non.solid|■\s*non.solid/i.test(s)) return '1';
  if (/\[v\]\s*part.solid|■\s*part.solid/i.test(s)) return '2';
  if (/\[v\]\s*solid|■\s*solid/i.test(s)) return '3';
  // v 格式
  if (/(?:^|[ \t])v[ \t]\s*non.solid/im.test(s)) return '1';
  if (/(?:^|[ \t])v[ \t]\s*part.solid/im.test(s)) return '2';
  if (/(?:^|[ \t])v[ \t]\s*solid/im.test(s)) return '3';
  return '';
}

function getSolidPart(s) {
  var m = s.match(/solid part[:\s]*_*([\d.]+)\s*mm/i);
  return m ? m[1] : '';
}

function getLobe(s) {
  // 找有勾的 lobe，支援三種格式
  var lobes = ['RUL','RML','RLL','LUL','LLL'];
  for (var i=0;i<lobes.length;i++) {
    var lb = lobes[i];
    var re = new RegExp('(\\[v\\]|■|(?:(?:^|[ \\t])v[ \\t]))\\s*'+lb,'im');
    if (re.test(s)) return String(i+1);
  }
  return '';
}

function getNodeStatus(s, hasPrior) {
  if (!hasPrior) return '4';
  if (/\[v\]\s*newly found|■\s*newly found|(?:^|[ \t])v[ \t]\s*newly found/im.test(s)) return '3';
  if (/\[v\]\s*enlarging|■\s*enlarging|(?:^|[ \t])v[ \t]\s*enlarging/im.test(s)) return '2';
  if (/\[v\]\s*unchanged|■\s*unchanged|(?:^|[ \t])v[ \t]\s*unchanged/im.test(s)) return '1';
  if (/no prior/i.test(s)) return '4';
  return '4';
}

function getLobeCode(s) {
  if (/\bRUL\b/i.test(s)) return '1';
  if (/\bRML\b/i.test(s)) return '2';
  if (/\bRLL\b/i.test(s)) return '3';
  if (/\bLUL\b/i.test(s)) return '4';
  if (/\bLLL\b/i.test(s)) return '5';
  return '';
}

// 取第 n 個 Nodule 的段落
function getNoduleSec(text, n) {
  var startRe = new RegExp('(?:\\[v\\]|■|(?:^|[ \\t])v[ \\t])\\s*Lung nodule '+n+'\\b|Lung nodule '+n+'\\s*\\(size','im');
  var sm = text.search(startRe);
  if (sm < 0) return '';
  var endRe = new RegExp('(?:\\[v\\]|■|(?:^|[ \\t])v[ \\t])?\\s*Lung nodule '+(n+1)+'\\b|Lung nodules else|Airway nodule|Atypical pulm|Other Lung|Overall','im');
  var rest = text.slice(sm+5);
  var em = rest.search(endRe);
  return em > 0 ? text.slice(sm, sm+5+em) : text.slice(sm);
}

// 判斷是否有勾選某欄（行內有勾選符號）
function lineChk(text, pattern) {
  var re = new RegExp('(?:\\[v\\]|■|(?:(?:^|[ \\t])v(?=[ \\t\\n])))\\s*' + pattern, 'im');
  return re.test(text);
}

// 取勾選行後的描述文字
function getDesc(text, pattern) {
  var re = new RegExp('(?:\\[v\\]|■|(?:(?:^|[ \\t])v(?=[ \\t])))\\s*' + pattern + '[^:\\n]*:?\\s*([^\\n\\[■□]+)', 'im');
  var m = text.match(re);
  if (!m) return '';
  var v = m[1].trim();
  // 排除全底線/全空格的佔位
  if (/^[_\s]+$/.test(v) || v.length < 2) return '';
  return v;
}

// ═══════════════════════════════════════
// MAIN PARSER
// ═══════════════════════════════════════
function doParseReport(text, meta) {
  var row = new Array(90).fill('');

  // ── 基本資料 ──
  row[0] = meta.name || '';
  row[1] = meta.birth || '';
  row[2] = meta.id || '';
  row[3] = meta.hosp || '';
  row[4] = meta.scan || '';
  row[5] = meta.read || '';

  // 判讀醫師
  var dm = text.match(/([^\s\n　]{2,5})醫師/);
  if (dm) row[6] = dm[1];

  // ── Quality ── 優先找 LDCT Quality 那行，找不到時搜全文
  var qlm = text.match(/LDCT Quality[^\n]*/i);
  var ql = qlm ? qlm[0] : text;
  if (/(\[v\]|■|(?:^|[ \t])v[ \t])\s*Not Acceptable/im.test(ql)) row[7] = '3';
  else if (/(\[v\]|■|(?:^|[ \t])v[ \t])\s*Acceptable/im.test(ql)) row[7] = '2';
  else if (/(\[v\]|■|(?:^|[ \t])v[ \t])\s*Good/im.test(ql)) row[7] = '1';

  // ── CTDIvol / DLP ──
  row[8] = getMGy(text, 'CTDIvol');
  row[9] = getMGy(text, 'Total DLP');

  // ── Prior CT ──
  // 找 No prior chest CT 那行，確認有無勾選
  var noPriorLine = (text.match(/No prior chest CT[^\n]*/i) || [''])[0];
  var hasPrior = false;
  if (/(\[v\]|■|(?:^|[ \t])v[ \t])/i.test(noPriorLine)) {
    hasPrior = false; // 明確勾選 No prior
  } else {
    // 找民國日期
    var dt = getRocDate(text);
    hasPrior = dt.length === 8;
  }
  row[10] = hasPrior ? '1' : '0';
  if (hasPrior) row[11] = getRocDate(text);

  // ── No lung nodule ──
  if (lineChk(text, 'No lung nodule')) row[12] = 'T';

  // ── Nodule with benign features ──
  if (lineChk(text, 'Nodule with benign')) row[13] = 'T';

  // ── <6mm ── 必須有勾選 且 IM/SE 有實際數字
  var lt6line = (text.match(/(?:\[v\]|■|(?:(?:^|[ \t])v[ \t]))[^\n]*Lung nodule[^\n]*<\s*6\s*mm[^\n]*/im) || [''])[0];
  if (!lt6line) lt6line = (text.match(/Lung nodule[^\n]*<\s*6[^\n]*/i) || [''])[0];
  if (lt6line && /(\[v\]|■|(?:^|[ \t])v[ \t])/i.test(lt6line)) {
    var lt6SE = getSE(lt6line);
    var lt6IM = getIM(lt6line);
    if (lt6SE || lt6IM) {
      row[14] = 'T';
      row[15] = lt6SE;
      row[16] = lt6IM;
    }
  }

  // ── Juxtapleural ──
  if (lineChk(text, 'Juxta.?pleural')) row[17] = 'T';

  // ── ≥6mm ──
  if (lineChk(text, 'Lung nodule[^\\n]*[≧≥]\\s*6')) {
    row[18] = 'T';
    // total number — 找 Overall 前的那段
    var nodBlock = (text.match(/Lung nodule[\s\S]*?(?=Other Lung|Overall)/i) || [text])[0];
    if (/(\[v\]|■|(?:^|[ \t])v[ \t])\s*>=\s*4|(\[v\]|■|(?:^|[ \t])v[ \t])\s*≧\s*4/im.test(nodBlock)) row[19] = '4';
    else if (/(\[v\]|■|(?:^|[ \t])v[ \t])\s*3\b/im.test(nodBlock) && /total number/i.test(nodBlock)) row[19] = '3';
    else if (/(\[v\]|■|(?:^|[ \t])v[ \t])\s*2\b/im.test(nodBlock) && /total number/i.test(nodBlock)) row[19] = '2';
    else if (/(\[v\]|■|(?:^|[ \t])v[ \t])\s*1\b/im.test(nodBlock) && /total number/i.test(nodBlock)) row[19] = '1';
    // fallback
    if (!row[19]) {
      var tnm = nodBlock.match(/total number[^0-9≧≥]*([1-4]|[≧≥]\s*4)/i);
      if (tnm) { var tv = tnm[1].trim(); row[19] = /[≧≥4]/.test(tv) ? '4' : tv; }
    }
  }

  // ── Nodules 1~3 ──
  for (var n=1; n<=3; n++) {
    var sec = getNoduleSec(text, n);
    if (!sec) continue;
    var szm = sec.match(/Entire Nodule:\s*_*([\d.]+)/i);
    if (!szm) continue;
    var b = (n-1)*7 + 20;
    row[b]   = szm[1];
    var dn   = getDensity(sec);
    row[b+1] = dn;
    if (dn === '2') row[b+2] = getSolidPart(sec);
    row[b+3] = getSE(sec);
    row[b+4] = getIM(sec);
    row[b+5] = getLobe(sec);
    row[b+6] = getNodeStatus(sec, hasPrior);
  }

  // ── Nodules else ──
  var elseM = text.match(/(\[v\]|■|(?:(?:^|[ \t])v[ \t]))\s*Lung nodules else([^\n]*)/im);
  if (elseM) {
    var el = elseM[0];
    row[41] = 'T';
    row[42] = getSE(el);
    row[43] = getIM(el);
    if (/(\[v\]|■)\s*RUL/i.test(el)) row[44]='T';
    if (/(\[v\]|■)\s*RML/i.test(el)) row[45]='T';
    if (/(\[v\]|■)\s*RLL/i.test(el)) row[46]='T';
    if (/(\[v\]|■)\s*LUL/i.test(el)) row[47]='T';
    if (/(\[v\]|■)\s*LLL/i.test(el)) row[48]='T';
  }

  // ── Airway nodule ──
  if (lineChk(text, 'Airway nodule')) {
    row[49] = 'T';
    if (lineChk(text, 'Subsegmental\\s*\\(Category 2\\)')) row[50]='T';
    if (lineChk(text, 'Segmental or more proximal')) {
      row[51]='T';
      if (lineChk(text, 'Favors sec')) row[52]='T';
      if (lineChk(text, 'At baseline')) row[53]='T';
      if (lineChk(text, 'Stable or growing')) row[54]='T';
    }
  }

  // ── Atypical pulmonary cyst ──
  if (lineChk(text, 'Atypical pulmonary cyst')) {
    row[55]='T';
    var cb = (text.match(/Atypical pulmonary cyst[\s\S]*?(?=The pattern|Other Lung|Overall|$)/i) || [text])[0];
    if (lineChk(cb,'Category 3')) {
      row[56]='T';
      var c3l = (cb.match(/Category 3[^\n]*/i)||[''])[0];
      row[57]=getSE(c3l); row[58]=getIM(c3l); row[59]=getLobeCode(c3l);
    }
    if (lineChk(cb,'Category 4A')) {
      row[60]='T';
      var c4al = (cb.match(/Category 4A[^\n]*/i)||[''])[0];
      row[61]=getSE(c4al); row[62]=getIM(c4al); row[63]=getLobeCode(c4al);
    }
    if (lineChk(cb,'Category 4B')) { row[64]='T'; }
  }

  // ── Other Lung Findings ──
  var stdLungFields = /Emphysema|Bronchiectasis|Bronchitis|Tree-in-bud|Centrilobular|Old pulmonary TB|Interstitial|ILD|Other[:\s]/i;
  if (lineChk(text,'Emphysema')) row[69]='T';
  if (lineChk(text,'Bronchiectasis')) row[70]='T';
  if (lineChk(text,'Bronchitis\\/bronchiolitis')) row[71]='T';
  if (lineChk(text,'Tree-in-bud')) row[72]='T';
  if (lineChk(text,'Centrilobular')) row[73]='T';
  if (lineChk(text,'Old pulmonary TB')) row[74]='T';
  if (lineChk(text,'Interstitial lung disease')) row[75]='T';

  // Other Lung (non-standard): 支援 "■ Other: xxx" 和 "■ Paraseptal bullae..." 等非標準格式
  var otherLungBlock = (text.match(/Other Lung Findings[\s\S]*?(?=Other Findings|Overall)/i)||[''])[0];
  if (otherLungBlock) {
    // 標準 Other: 格式
    var otm = otherLungBlock.match(/(\[v\]|■|(?:(?:^|[ \t])v[ \t]))\s*Other[:\s]+([^\n\[\]■□_][^\n]+)/im);
    if (otm && !/^[_\s]+$/.test(otm[2].trim())) {
      row[76]='T'; row[77]=otm[2].trim();
    }
    // 非標準: ■ 勾選但不屬於標準欄位的文字
    if (!row[76]) {
      var lines = otherLungBlock.split('\n');
      var extras = [];
      for (var li=0;li<lines.length;li++) {
        var ln = lines[li];
        if (/(\[v\]|■)\s*\S/.test(ln) && !stdLungFields.test(ln)) {
          var txt = ln.replace(/^[\s■\[v\]]+/,'').trim();
          if (txt.length > 3) extras.push(txt);
        }
      }
      if (extras.length) { row[76]='T'; row[77]=extras.join('. '); }
    }
  }

  // ── Other Findings ──
  if (lineChk(text,'Enlarged lymph nodes')) {
    row[78]='T';
    var lnd = getDesc(text,'Enlarged lymph nodes');
    row[79] = lnd;
  }
  if (lineChk(text,'Coronary artery calc')) {
    row[80]='T';
    var cad = getDesc(text,'Coronary artery calc[^:\\n]*');
    row[81] = cad;
  }
  if (lineChk(text,'Other significant abnormal chest')) {
    row[82]='T';
    var chd = getDesc(text,'Other significant abnormal chest[^:\\n]*');
    row[83] = chd;
  }
  // Abdominal — 可能跨行 (abdominal\n  or neck)
  var abMatch = text.match(/(\[v\]|■|(?:(?:^|[ \t])v[ \t]))\s*Other significant abnormal abdominal([^\n]*(?:\n[ \t]+or neck[^\n]*)?[^\n]*:?\s*)([^\n\[■□]+)/im);
  if (abMatch) {
    row[84]='T';
    var abv = abMatch[3].trim();
    if (!/^[_\s]+$/.test(abv) && abv.length>1) row[85]=abv;
  }

  // 非標準欄位 (S/p cholecystectomy, Rib old fracture 等)
  var extraItems = [];
  if (/(\[v\]|■)\s*S\/p cholecystectomy/i.test(text)) extraItems.push('S/p cholecystectomy');
  if (/(\[v\]|■)\s*Rib old fracture/i.test(text)) extraItems.push('Rib old fracture noted over right thoracic cage');
  if (extraItems.length) {
    row[82]='T';
    row[83]=(row[83]?row[83]+' ':'')+extraItems.join('. ')+'.';
  }

  // ── Overall Category ── 只看 Overall recommendation 段落
  var ob = (text.match(/Overall recommendation[\s\S]*$/im)||[text])[0];
  var catChk = function(p){ return new RegExp('(\\[v\\]|■|(?:(?:^|[ \\t])v[ \\t]))\\s*'+p,'im').test(ob); };
  if (catChk('Category 4X')) row[86]='9';
  else if (catChk('Category 4B')) row[86]='8';
  else if (catChk('Category 4A') && !row[55]) row[86]='4';
  else if (catChk('Category 3')) row[86]='3';
  else if (catChk('Category 2')) row[86]='2';
  else if (catChk('Category 1')) row[86]='1';
  else if (catChk('Category 0')) {
    row[86]='0';
    if (catChk('Prior chest CT exam.*being located')) row[87]='1';
    else if (catChk('Part or all')) row[87]='2';
    else if (catChk('Findings suggestive')) row[87]='3';
  }

  // ── Modifier S / 門診 ──
  if (lineChk(ob,'(?:Modifier S|Category S)')) row[88]='T';
  if (lineChk(ob,'請至門診就診')) row[89]='T';

  return row;
}

// ═══════════════════════════════════════
// VALIDATE
// ═══════════════════════════════════════
function validate(row) {
  var w=[],e=[];
  if (row[2] && row[2].length!==10) w.push('身分證字號 '+row[2].length+' 碼（應為 10 碼）：'+row[2]);
  if (!row[7]) e.push('LDCT Quality 未填');
  if (!row[8]) e.push('CTDIvol 未填');
  if (!row[9]) e.push('Total DLP 未填');
  if (!row[86]) e.push('Overall Category 未填');
  if (row[10]==='1' && !row[11]) w.push('有 Prior CT 但日期未解析，請手動確認');
  if (row[86]==='0' && !row[87]) w.push('Category 0 但 subtype 未填');
  if (row[18]==='T' && row[19]) {
    var t=row[19];
    if ((t==='2'||t==='3'||t==='4') && !row[27]) w.push('Total='+t+' 但 Nodule 2 無資料');
    if ((t==='3'||t==='4') && !row[34]) w.push('Total='+t+' 但 Nodule 3 無資料');
    if (t==='4' && row[41]!=='T') w.push('Total≥4 但 Nodules else 未勾選');
  }
  if (row[8]&&row[9]) {
    var ratio=parseFloat(row[9])/parseFloat(row[8]);
    if (ratio<20||ratio>90) w.push('DLP/CTDIvol 比值 '+ratio.toFixed(1)+'，超出 20-90 範圍');
  }
  return {w:w,e:e};
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderResult(row) {
  var v=validate(row), html='';
  v.e.forEach(function(x){ html+='<div class="alert ae">❌ '+esc(x)+'</div>'; });
  v.w.forEach(function(x){ html+='<div class="alert aw">⚠️ '+esc(x)+'</div>'; });
  if (!v.e.length&&!v.w.length) html+='<div class="alert ao">✅ 解析完成，無異常</div>';
  GROUPS.forEach(function(g){
    html+='<div class="fg"><div class="gt">'+g.t+'</div>';
    g.c.forEach(function(i){
      var val=row[i], cls=val?'f':'e';
      html+='<div class="fr"><div class="fn">'+(i+1)+'</div><div class="fname">'+esc(HSHORT[i])+'</div><div class="fv '+cls+'">'+esc(val||'—')+'</div></div>';
    });
    html+='</div>';
  });
  document.getElementById('rArea').innerHTML=html;
  var filled=row.filter(function(v){return v;}).length;
  document.getElementById('sFill').textContent='已填 '+filled;
  document.getElementById('sWarn').textContent='警告 '+v.w.length;
  document.getElementById('sErr').textContent='錯誤 '+v.e.length;
  document.getElementById('rSub').textContent=row[2]?'身分證：'+row[2]:'預覽中';
}

// ═══════════════════════════════════════
// STATE & UI
// ═══════════════════════════════════════
var currentRow=null, batch=[], qIdx=-1;

function getMeta(){
  return {
    name:document.getElementById('mName').value.trim(),
    birth:document.getElementById('mBirth').value.trim(),
    id:document.getElementById('mId').value.trim(),
    hosp:document.getElementById('mHosp').value.trim(),
    scan:document.getElementById('mScan').value.trim(),
    read:document.getElementById('mRead').value.trim()
  };
}

function doParse(){
  var t=document.getElementById('rInput').value;
  if (!t.trim()){alert('請先貼入報告文字');return;}
  currentRow=doParseReport(t,getMeta());
  renderResult(currentRow);
}

function doAdd(){
  var t=document.getElementById('rInput').value;
  if (!t.trim()){alert('請先貼入報告文字');return;}
  var meta=getMeta(), row=doParseReport(t,meta), v=validate(row);
  var label=row[2]||('Case '+(batch.length+1));
  batch.push({row:row,meta:meta,text:t,w:v.w,e:v.e,label:label});
  renderQueue();
  document.getElementById('btnE').disabled=false;
  document.getElementById('qCount').textContent='批次：'+batch.length+' 筆';
  doClear();
}

function doClear(){
  document.getElementById('rInput').value='';
  ['mId','mName','mBirth','mScan','mRead','mHosp'].forEach(function(id){document.getElementById(id).value='';});
  currentRow=null; qIdx=-1;
  document.getElementById('rArea').innerHTML='<div class="es"><div class="ei">📄</div><div>貼入報告並點擊「解析報告」</div></div>';
  document.getElementById('sFill').textContent='已填 0';
  document.getElementById('sWarn').textContent='警告 0';
  document.getElementById('sErr').textContent='錯誤 0';
  document.getElementById('rSub').textContent='等待解析';
  renderQueue();
}

function renderQueue(){
  document.getElementById('qItems').innerHTML=batch.map(function(item,i){
    var cls='qi'+(i===qIdx?' active':item.e.length?' warn':' done');
    return '<div class="'+cls+'" onclick="previewQ('+i+')">'+esc(item.label)+'</div>';
  }).join('');
}

function previewQ(idx){
  qIdx=idx; var item=batch[idx];
  document.getElementById('rInput').value=item.text;
  document.getElementById('mId').value=item.meta.id||'';
  document.getElementById('mName').value=item.meta.name||'';
  document.getElementById('mBirth').value=item.meta.birth||'';
  document.getElementById('mScan').value=item.meta.scan||'';
  document.getElementById('mRead').value=item.meta.read||'';
  document.getElementById('mHosp').value=item.meta.hosp||'';
  currentRow=item.row; renderResult(item.row); renderQueue();
}

function doExport(){
  if (!batch.length){alert('尚未加入任何筆次');return;}
  var rows=[HFULL].concat(batch.map(function(item){return item.row;}));
  var csv=rows.map(function(r){
    return r.map(function(v){
      var s=String(v);
      return (s.indexOf(',')>=0||s.indexOf('"')>=0||s.indexOf('\n')>=0)?'"'+s.replace(/"/g,'""')+'"':s;
    }).join(',');
  }).join('\r\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;
  var d=new Date();
  a.download='LDCTA_batch_'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('btnP').addEventListener('click',doParse);
document.getElementById('btnA').addEventListener('click',doAdd);
document.getElementById('btnC').addEventListener('click',doClear);
document.getElementById('btnE').addEventListener('click',doExport);
window.previewQ=previewQ;
</script>
